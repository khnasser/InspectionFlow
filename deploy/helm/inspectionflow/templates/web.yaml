apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "if.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "if.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels: {{- include "if.selector" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "if.webImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: API_UPSTREAM
              value: http://{{ .Release.Name }}-api:3000
          readinessProbe:
            httpGet: { path: /, port: http }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "if.labels" . | nindent 4 }}
spec:
  selector: {{- include "if.selector" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - { name: http, port: 80, targetPort: http }

{{- if .Values.migrations.enabled }}
# Applies db/migrations with the owner connection before the new pods start.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  labels: {{- include "if.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {{- include "if.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "if.serviceAccount" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "if.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "apps/api/dist/db/migrate.js"]
          env:
            - name: DATABASE_ADMIN_URL
              valueFrom: { secretKeyRef: { name: {{ include "if.secretName" . }}, key: DATABASE_ADMIN_URL } }
          securityContext: {{- include "if.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
{{- end }}

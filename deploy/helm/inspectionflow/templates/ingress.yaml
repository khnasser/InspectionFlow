{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "if.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          {{- range $p := list "/v1" "/verify" "/health" }}
          - path: {{ $p }}
            pathType: Prefix
            backend: { service: { name: {{ $.Release.Name }}-api, port: { number: 3000 } } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-web, port: { number: 80 } } }
{{- end }}

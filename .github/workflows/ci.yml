name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inspectionflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/inspectionflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @inspectionflow/engine && npm run build -w @inspectionflow/sync-client
      - run: npm run typecheck
      # PDF report tests render with local Chromium (production uses Gotenberg).
      - run: |
          npm install -g playwright@1.63.0 && npx -y playwright@1.63.0 install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      # S3-compatible server for the storage-driver tests.
      - run: |
          pipx install "moto[server]==5.0.21"
          nohup moto_server -H 127.0.0.1 -p 4566 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:4566/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/moto.log; exit 1
      - run: npm test
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
      - run: npm run build -w @inspectionflow/web

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build -w @inspectionflow/engine && npm run build -w @inspectionflow/sync-client
      - run: npm ci --install-links
        working-directory: apps/mobile
      - run: npx tsc --noEmit
        working-directory: apps/mobile
      - run: npx expo export --platform android --output-dir /tmp/expo-out
        working-directory: apps/mobile
        env:
          EXPO_OFFLINE: '1'
          CI: '1'

  # Real Keycloak 26 (realm import, PKCE sign-in, UAE PASS broker redirect) and
  # Gotenberg 8 (PDF rendering), exercised by apps/api/test/live-services.e2e.spec.ts.
  live-services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inspectionflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      gotenberg:
        image: gotenberg/gotenberg:8
        ports: ['3001:3000']
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/inspectionflow
      LIVE_KEYCLOAK_URL: http://localhost:8081
      LIVE_GOTENBERG_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start Keycloak with the demo realm
        run: |
          docker run -d --name keycloak -p 8081:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/deploy/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.0 start-dev --import-realm --hostname=http://localhost:8081
      - run: npm ci
      - run: npm run build -w @inspectionflow/engine
      - run: |
          npm install -g playwright@1.63.0 && npx -y playwright@1.63.0 install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Wait for Keycloak and Gotenberg
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/realms/inspectionflow-demo/.well-known/openid-configuration >/dev/null \
              && curl -sf http://localhost:3001/health >/dev/null && exit 0
            sleep 3
          done
          docker logs keycloak | tail -50; exit 1
      - run: npx jest test/live-services.e2e.spec.ts
        working-directory: apps/api
      - if: failure()
        run: docker logs keycloak | tail -100

  # Container images (pushed to GitHub Container Registry from main) and the
  # Helm chart, rendered and checked against the Kubernetes API schemas.
  images-and-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint and validate the Helm chart
        run: |
          helm lint deploy/helm/inspectionflow
          helm template staging deploy/helm/inspectionflow -f deploy/helm/staging-values.example.yaml > /tmp/rendered.yaml
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /tmp
          /tmp/kubeconform -strict -summary -kubernetes-version 1.30.0 /tmp/rendered.yaml
      - uses: docker/setup-buildx-action@v3
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and on main, push) the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/khnasser/inspectionflow-api:${{ github.sha }}
            ghcr.io/khnasser/inspectionflow-api:main
      - name: Build (and on main, push) the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/khnasser/inspectionflow-web:${{ github.sha }}
            ghcr.io/khnasser/inspectionflow-web:main
      - name: Smoke-test the API image (migrations entry point present, starts and answers /health)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker run --rm ghcr.io/khnasser/inspectionflow-api:${{ github.sha }} test -f apps/api/dist/db/migrate.js
          docker run --rm ghcr.io/khnasser/inspectionflow-api:${{ github.sha }} ls db/migrations

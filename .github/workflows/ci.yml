name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inspectionflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/inspectionflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @inspectionflow/engine && npm run build -w @inspectionflow/sync-client
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @inspectionflow/web

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build -w @inspectionflow/engine && npm run build -w @inspectionflow/sync-client
      - run: npm ci --install-links
        working-directory: apps/mobile
      - run: npx tsc --noEmit
        working-directory: apps/mobile
      - run: npx expo export --platform android --output-dir /tmp/expo-out
        working-directory: apps/mobile
        env:
          EXPO_OFFLINE: '1'
          CI: '1'

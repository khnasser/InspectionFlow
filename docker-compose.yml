# Local stack: PostgreSQL + API + web + Gotenberg (PDF) + Keycloak. Development settings only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inspectionflow
    ports: ['5432:5432']
    volumes: ['dbdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  # One-off: apply migrations and seed the demo tenant (runs as the DB owner).
  migrate:
    image: node:22-alpine
    depends_on: { db: { condition: service_healthy } }
    working_dir: /repo
    volumes: ['.:/repo']
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@db:5432/inspectionflow
    command: sh -c "npm ci && npm run build -w @inspectionflow/engine && npm run db:migrate && npm run db:seed"

  api:
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      # The image defaults to production, which refuses dev sign-in and local storage.
      NODE_ENV: development
      DATABASE_URL: postgres://inspectionflow_api:inspectionflow_api@db:5432/inspectionflow
      AUTH_MODE: dev
      JWT_DEV_SECRET: change-me-dev-secret-at-least-32-characters
      PAYMENT_WEBHOOK_SECRET: change-me-webhook-secret
      PUBLIC_BASE_URL: http://localhost:8080
      VERIFY_BASE_URL: http://localhost:8080
      # Evidence on a local volume here; production uses STORAGE_DRIVER=s3 (bucket with SSE-KMS).
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/storage
      STORAGE_SIGNING_SECRET: change-me-storage-signing-secret-32ch
      REPORT_RENDERER: gotenberg
      GOTENBERG_URL: http://gotenberg:3000
    volumes: ['storage:/data/storage']
    ports: ['3000:3000']

  # HTML -> PDF (headless Chromium). Reports inline fonts and photos, so it needs no internet.
  gotenberg:
    image: gotenberg/gotenberg:8
    command: ['gotenberg', '--api-timeout=60s']

  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    depends_on: [api]
    ports: ['8080:8080']

  # Identity provider (development mode). Realm inspectionflow-demo with web/mobile PKCE clients,
  # a tenant claim and UAE PASS (staging sandbox) as a brokered identity provider.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_PORT: '8080'
    volumes: ['./deploy/keycloak:/opt/keycloak/data/import:ro']
    ports: ['8081:8080']

volumes:
  dbdata:
  storage:
